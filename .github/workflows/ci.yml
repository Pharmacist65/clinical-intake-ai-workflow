name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend dependencies
        run: dotnet restore backend/ClinicalIntake.Api.Tests/ClinicalIntake.Api.Tests.csproj

      - name: Run backend tests
        run: dotnet test backend/ClinicalIntake.Api.Tests/ClinicalIntake.Api.Tests.csproj --configuration Release --no-restore --verbosity normal

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend contract tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build browser-only showcase
        run: npm run build:demo
