services:
  backend:
    build:
      context: .
      dockerfile: backend/ClinicalIntake.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiDocs__Enabled: "true"
      DemoData__SeedOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Data Source=/data/clinical-intake.db"
    ports:
      - "5108:8080"
    volumes:
      - clinical-intake-data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: "http://localhost:5108"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  clinical-intake-data:
